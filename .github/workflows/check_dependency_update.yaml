name: Check Dependencies for Updates

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  check-and-update:
    name: Check, test, and commit dependency updates
    runs-on: ubuntu-latest
    env:
      TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.REPO_PAT || github.token }}
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Prepare stable dependency updates
        id: check_diff
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT || github.token }}
        run: |
          python3 .github/scripts/update_dependencies.py
          if git diff --quiet Dockerfile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Stable dependency updates detected in Dockerfile."
          fi

      - name: Install ShellCheck if needed
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          if ! command -v shellcheck > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi

      - name: Validate workflows
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.11

      - name: Lint shell scripts
        if: steps.check_diff.outputs.changed == 'true'
        run: bash tests/run.sh --lint-only

      - name: Validate Compose sample
        if: steps.check_diff.outputs.changed == 'true'
        run: docker compose -f docker-compose.yml.sample config --quiet

      - name: Build cached test image
        if: steps.check_diff.outputs.changed == 'true'
        uses: ./.github/actions/build-recorder
        with:
          platform: linux/amd64
          arch: amd64

      - name: Verify application user permissions
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          docker run --rm --network none --entrypoint bash -e TEST_APP_USER=apps \
            --mount "type=bind,source=$PWD,target=/project,readonly" --workdir /project \
            streamlink-recorder:test tests/test_permissions_isolation.sh

      - name: Check container startup without live services
        if: steps.check_diff.outputs.changed == 'true'
        run: bash tests/test_container.sh

      - name: Check release image dependencies
        if: steps.check_diff.outputs.changed == 'true'
        run: bash tests/scan_image.sh

      - name: Retain failed check diagnostics
        if: failure() && steps.check_diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: failed-check-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore

      - name: Commit and push verified updates
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "Automated: Update stable recorder dependencies"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Dispatch image build if using default token
        if: steps.check_diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          if [ -z "$REPO_PAT" ]; then
            gh workflow run docker-image.yml --ref "${{ github.event.repository.default_branch }}" || true
          fi
