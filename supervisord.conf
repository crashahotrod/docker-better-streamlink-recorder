stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:streamlink_normalize]
command=/etc/streamlink/tools/normalize.sh
user=%(ENV_USER_NAME)s
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:streamlink_status]
