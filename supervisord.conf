[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:streamlink_download]
command=/etc/streamlink/tools/download.sh
user=%(ENV_USER_NAME)s
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:streamlink_encode]
command=/etc/streamlink/tools/encode.sh
user=%(ENV_USER_NAME)s
autostart=%(ENV_ENCODE)s
autorestart=true
stopasgroup=true
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:streamlink_upload]
command=/etc/streamlink/tools/upload.sh
user=%(ENV_USER_NAME)s
autostart=%(ENV_UPLOAD)s
autorestart=true
stopasgroup=true
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:streamlink_publish]
command=/etc/streamlink/tools/publish.sh
user=%(ENV_USER_NAME)s
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:streamlink_normalize]
command=/etc/streamlink/tools/normalize.sh
user=%(ENV_USER_NAME)s
autostart=true
autorestart=true
stopasgroup=true
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
