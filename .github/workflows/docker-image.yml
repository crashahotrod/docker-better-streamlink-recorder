name: Docker Image CI

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    name: Lint and configuration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck if needed
        run: |
          if ! command -v shellcheck > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
      - name: Validate workflows
        run: docker run --rm --network none -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.11
      - name: Lint shell scripts
        run: bash tests/run.sh --lint-only
      - name: Validate Compose sample
        run: docker compose -f docker-compose.yml.sample config --quiet

  images:
    name: Build and verify (${{ matrix.arch }})
    # Independent of lint and the other platforms: only publication waits for all.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts
    steps:
      - uses: actions/checkout@v6
      - name: Image metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }},priority=1000
            type=semver,pattern={{version}},priority=900
            type=semver,pattern={{major}}.{{minor}},priority=850
            type=ref,event=branch,priority=800
            type=sha,format=short,priority=600,enable=false
      - uses: ./.github/actions/build-recorder
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify permissions from a private checkout
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm --network none --entrypoint bash -e TEST_APP_USER=apps \
            --mount "type=bind,source=$PWD,target=/project,readonly" --workdir /project \
            streamlink-recorder:test tests/test_permissions_isolation.sh
      - name: Check application startup and complete recording suite
        if: matrix.arch == 'amd64'
        run: bash tests/test_container.sh
      - name: Check platform dependencies and media publication
        if: matrix.arch != 'amd64'
        run: |
          docker run --rm --network none -e MODE=twitch -e CHANNEL=platform \
            -e CLIENT_ID=example -e CLIENT_SECRET=example \
            --mount "type=bind,source=$PWD,target=/project,readonly" \
            streamlink-recorder:test bash /project/tests/test_platform.sh
      - name: Check release image dependencies
        run: bash tests/scan_image.sh
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage verified image and record immutable registry digests
        if: github.event_name != 'pull_request'
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: python3 .github/scripts/publish_images.py stage --arch '${{ matrix.arch }}' --directory digests
      - name: Upload digest receipt
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Retain failed check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-check-diagnostics-${{ matrix.arch }}
          path: test-artifacts/
          if-no-files-found: ignore
          overwrite: true

  build-test-push:
    name: Publish verified multi-architecture manifests
    needs: [checks, images]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }},priority=1000
            type=semver,pattern={{version}},priority=900
            type=semver,pattern={{major}}.{{minor}},priority=850
            type=ref,event=branch,priority=800
            type=sha,format=short,priority=600,enable=false
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble release tags from tested digests (no rebuild)
        env:
          IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: python3 .github/scripts/publish_images.py merge --directory digests
      - name: Delete Old and Untagged Images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}
          keep-n-tagged: 5
          delete-untagged: true
          older-than: 90 days
          dry-run: false
