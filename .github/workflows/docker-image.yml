name: Docker Image CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
    types: [opened, synchronize, reopened]

jobs:
  checks:
    name: Recording pipeline checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl jq shellcheck gosu supervisor
      - name: Run shell and media checks
        run: bash tests/run.sh
      - name: Verify application user permissions
        run: |
          sudo useradd --create-home --user-group recorder-test
          sudo TEST_APP_USER=recorder-test bash tests/test_permissions.sh
          sudo TEST_APP_USER=recorder-test bash tests/test_permissions_isolation.sh
      - name: Validate Compose sample
        run: docker compose -f docker-compose.yml.sample config --quiet
      - name: Build local test image
        run: docker build -t streamlink-recorder:test .
      - name: Check container startup without live services
        run: bash tests/test_container.sh
      - name: Retain failed media diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-media-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore

  build-test-push:
    name: Build, Test and Push Docker Image
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history for better caching/context
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }},priority=1000
            type=ref,event=branch,priority=800
            type=sha,format=short,priority=600,enable=false

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete Old and Untagged Images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}
          keep-n-tagged: 5
          delete-untagged: true
          older-than: 90 days
          dry-run: false
