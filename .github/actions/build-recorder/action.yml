name: Build cached recorder image
description: Build one release architecture with persistent layer and Go caches
inputs:
  platform:
    description: Docker target platform
    required: true
  arch:
    description: Cache namespace (amd64 or arm64)
    required: true
  image:
    description: Local image tag used by the offline checks
    default: streamlink-recorder:test
  labels:
    description: Optional OCI image labels
    default: ''
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - name: Restore Go module and compiler caches
      id: go-cache
      uses: actions/cache@v5
      with:
        path: |
          ${{ runner.temp }}/recorder-go-mod
          ${{ runner.temp }}/recorder-go-build
        key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.arch }}-${{ hashFiles('Dockerfile', 'build/uploader-modules.txt') }}
        restore-keys: |
          go-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.arch }}-
    # Layer exports do not include cache-mount contents. The actions' post steps
    # extract both mounts before actions/cache saves them on a cache miss.
    - name: Inject Go module cache
      uses: reproducible-containers/buildkit-cache-dance@4b2444fec0c0fb9dbf175a96c094720a692ef810 # v2.1.4
      with:
        cache-source: ${{ runner.temp }}/recorder-go-mod
        cache-target: /go/pkg/mod
        scratch-dir: ${{ runner.temp }}/recorder-dance-mod
        skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}
    - name: Inject Go compiler cache
      uses: reproducible-containers/buildkit-cache-dance@4b2444fec0c0fb9dbf175a96c094720a692ef810 # v2.1.4
      with:
        cache-source: ${{ runner.temp }}/recorder-go-build
        cache-target: /root/.cache/go-build
        scratch-dir: ${{ runner.temp }}/recorder-dance-build
        skip-extraction: ${{ steps.go-cache.outputs.cache-hit }}
    - name: Build and load release image
      uses: docker/build-push-action@v7
      with:
        context: .
        target: release
        platforms: ${{ inputs.platform }}
        load: true
        pull: true
        tags: ${{ inputs.image }}
        labels: ${{ inputs.labels }}
        cache-from: type=gha,scope=recorder-${{ inputs.arch }}
        cache-to: type=gha,scope=recorder-${{ inputs.arch }},mode=max
